name: Publicar estático na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar site estático
        run: npm run build

      - name: Publicar arquivos compilados na branch hostinger
        run: |
          mkdir deploy
          cp -R dist/. deploy/
          cd deploy
          git init
          git checkout -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy estático para Hostinger"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin hostinger
